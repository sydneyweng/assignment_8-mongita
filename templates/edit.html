{% extends 'base.html' %}
{% block container %}

<main id="editPage">
    <h1>Edit Book</h1>

    <form id="editForm" method="POST" action="{{ url_for('edit_post', book_id=book.bookId) }}">
        <label>Title:</label>
        <input type="text" name="title" value="{{ book.title }}" required>
        
        <label>Author:</label>
        <input type="text" name="author" value="{{ book.author }}" required>
        
        <label>ISBN:</label>
        <input type="text" name="isbn" value="{{ book.isbn }}" required>
        
        <label>Price:</label>
        <input type="number" step="0.01" name="price" value="{{ book.price }}" required>

        <label>Category:</label>
        <select name="categoryId" required>
            {% for category in categories %}
                <option value="{{ category.categoryId }}"
                    {% if category.categoryId == book.categoryId %}selected{% endif %}>
                    {{ category.categoryName }}
                </option>
            {% endfor %}
        </select>

        <label>Image:</label>
        <input type="text" name="image" value="{{ book.image }}" required>
        
        <label>Read Now:</label>
        <select name="readNow">
            <option value="0" {% if book.readNow == 0 %}selected{% endif %}>0</option>
            <option value="1" {% if book.readNow == 1 %}selected{% endif %}>1</option>
        </select>

        <div id="editActions">
            <button type="submit">Update Book</button>
            <a class="cancelButton" href="{{ url_for('read') }}">Cancel</a>
        </div>
    </form>
</main>
{% endblock %}
