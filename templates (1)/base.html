<!DOCTYPE html>
<html>
  <head>
    <title>Syd's Book Collection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
  </head>
  <body>
    <header id="topHeader">
      <div id="headerLeft">

        <form action="{{ url_for('search') }}" method="post" class="searchForm">
            <input type="text" name="search" placeholder="Search By Book Title">
            <button type="submit">Search</button>
        </form>

        <a href="{{ url_for('read')}}" class="headerButton">Book List</a>

      </div>

      <div id="headerCenter">
        <a href="{{ url_for('home') }}">
          <img src="{{ url_for('static', filename='images/menu/syds-book-collection-logo.jpg') }}"
               alt="Syd's Book Collection Logo">
        </a>
      </div>

      <div id="headerRight">
        <a href="#" id="cartIcon">
           <img src="{{ url_for('static', filename='images/menu/cart-icon.jpg') }}"
                alt="Shopping Cart">
        </a>

        <a href="#" class="headerButton">Login</a>
      </div>
    </header>

    <main>{% block container %}{% endblock %}</main>







</body>
</html>
